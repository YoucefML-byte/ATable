      });

      tl.fromTo(".f04-il-compose-progress-fill", { scaleX: 1 / 3 }, { scaleX: 2 / 3, duration: 0.6, ease: "power3.inOut", immediateRender: false }, 3.0);

      // ===== Scene 3 (5.0–6.5): zoom eases back, press, slide to confirmation, stamp =====
      tl.fromTo(".f04-il-compose-zo-b", { scale: S2 }, { scale: 1, duration: 0.55, ease: "power2.inOut", immediateRender: false }, 4.45);
      tl.fromTo(".f04-il-compose-zi-b", { x: T2.x, y: T2.y }, { x: 0, y: 0, duration: 0.55, ease: "power2.inOut", immediateRender: false }, 4.45);

      // highlight ring on « Envoyer ma commande »
      tl.fromTo(".f04-il-compose-btnring", { scale: 1.08, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, 4.65);

      // press-release-spring: linear dip, spring release (adjacent positions)
      tl.fromTo(".f04-il-compose-btn", { scale: 1 }, { scale: 0.92, duration: 0.12, ease: "power1.in" }, 5.0);
      tl.fromTo(".f04-il-compose-btn", { scale: 0.92 }, { scale: 1, duration: 0.45, ease: "back.out(2)", immediateRender: false }, 5.12);
      tl.fromTo(".f04-il-compose-btn-dark", { opacity: 0 }, { opacity: 0.22, duration: 0.12, ease: "power1.in" }, 5.0);
      tl.fromTo(".f04-il-compose-btn-dark", { opacity: 0.22 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 5.12);
      tl.fromTo(".f04-il-compose-btnring", { scale: 1, opacity: 1 }, { scale: 1.05, opacity: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, 5.12);

      // screen slides to the confirmation
      tl.fromTo(".f04-il-compose-strip", { x: -420 }, { x: -840, duration: 0.4, ease: "power4.inOut", immediateRender: false }, 5.3);

      // headline 2 → « Envoyé. »: inverse zoom-through (arrival)
      tl.fromTo(".f04-il-compose-h2", { scale: 1, filter: "blur(0px)" }, { scale: 0.8, filter: "blur(10px)", duration: 0.2, ease: "power3.in" }, 5.3);

      tl.fromTo(".f04-il-compose-stamp", { scale: 1.35, opacity: 0, rotation: -8, y: 0 }, { scale: 1, opacity: 0.9, rotation: -8, y: 0, duration: 0.22, ease: "power3.out" }, 6.0);

      tl.fromTo(".f04-il-compose-stamp", { y: 2 }, { y: 0, duration: 0.06, ease: "power1.inOut", immediateRender: false }, 6.28);

      // ===== time-driven layer: tap ripples, discrete type-on, caret =====
      var SEQ = [
        [0.0, ""],
        [2.9, "S"],
        [2.98, "Sa"],
        [3.05, "Sau"],
        [3.13, "Sauc"],
        [3.2, "Sauce"],
        [3.3, "Sauce "],
        [3.52, "Sauce à"],
        [3.62, "Sauce à "],
        [3.78, "Sauce à p"],
        [3.85, "Sauce à pa"],
        [3.92, "Sauce à par"],
        [3.99, "Sauce à part"],
        [4.08, "Sauce à part "],
        [4.22, "Sauce à part s"],
        [4.3, "Sauce à part sv"],
        [4.38, "Sauce à part svp"]

        return "";

      function caretOn(t) {
        if (t >= 2.9 && t < 4.45) return true; // solid while typing
        var ref = t < 2.9 ? 2.4 : 4.45;
        var ph = (((t - ref) % 0.9) + 0.9) % 0.9;
        return ph < 0.5;

      var caret = q(".f04-il-compose-caret");
      var ripples = [
        { ring: q(".f04-il-compose-ring-a"), dot: q(".f04-il-compose-tapdot-a"), t0: 0.9 },
        { ring: q(".f04-il-compose-ring-b"), dot: q(".f04-il-compose-tapdot-b"), t0: 1.4 },
        { ring: q(".f04-il-compose-ring-c"), dot: q(".f04-il-compose-tapdot-c"), t0: 5.0 }
      ];
      function ripple(r, t) {
        var u = (t - r.t0) / 0.5;
        if (u <= 0 || u >= 1) {
          r.ring.style.opacity = "0";
          r.dot.style.opacity = "0";
          return;
        }
        var e = 1 - Math.pow(1 - u, 3);
        r.ring.style.transform = "scale(" + (0.3 + 0.7 * e).toFixed(4) + ")";
        r.ring.style.opacity = (0.95 * (1 - u)).toFixed(3);
        var d = u < 0.1 ? u / 0.1 : Math.max(0, 1 - (u - 0.1) / 0.5);
        r.dot.style.transform = "scale(" + (0.6 + 0.4 * e).toFixed(4) + ")";
        r.dot.style.opacity = (0.5 * d).toFixed(3);
      }

      var lastText = null;
      function render(t) {
        var s = textAt(t);
        if (s !== lastText) {
          noteText.textContent = s;
          lastText = s;
        }
        caret.style.opacity = caretOn(t) ? "1" : "0";
        for (var i = 0; i < ripples.length; i++) ripple(ripples[i], t);
      }

      var drv = { t: 0 };
      tl.fromTo(drv, { t: 0 }, {
        t: 8,
        duration: 8,
        ease: "none",
        onUpdate: function () { render(drv.t); }
