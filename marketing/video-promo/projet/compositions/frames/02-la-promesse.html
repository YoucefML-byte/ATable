      var tl = gsap.timeline({ paused: true });

      // ---------- macro camera: a slow push underneath the whole shot ----------
      tl.fromTo(
        el("stage"),
        { scale: 1, transformOrigin: "960px 450px" },
        { scale: 1.02, duration: DURATION, ease: "none" },
        0
      );

      // ---------- Scene 1 (0.0-1.6s): the ticket feeds down in short steps ----------
      var paper = el("paper");
      var edge = el("edge");
      var PAPER_H = 660;
      function inset(reveal) {
        return "inset(0px 0px " + (PAPER_H - reveal) + "px 0px)";
      }
      // [start, duration, reveal edge (px from paper top)]
      var FEED = [
        [0.02, 0.14, 272], // header (logo space) feeds out
        [0.2, 0.1, 336], // ATABLE
        [0.4, 0.06, 362], // rule
        [0.6, 0.1, 428], // TABLE 4
        [1.0, 0.08, 466], // COMMANDE N° 001
        [1.1, 0.06, 496], // rule
        [1.2, 0.08, 546], // 1 × TACOS 2 VIANDES
        [1.4, 0.08, 586], // 1 × LIMONADE
        [1.6, 0.1, 636], // NOTE : SAUCE À PART SVP
        [1.74, 0.18, 660] // last feed, torn edge hangs free
      ];
      var prev = 120;
      FEED.forEach(function (s, i) {
        tl.fromTo(
          paper,
          { clipPath: inset(prev) },
          { clipPath: inset(s[2]), duration: s[1], ease: "power2.out", immediateRender: i === 0 },
          s[0]
        );
        tl.fromTo(
          edge,
          { y: prev },
          { y: s[2], duration: s[1], ease: "power2.out", immediateRender: i === 0 },
          s[0]
        );
        prev = s[2];
      });

      // thermal ink darkens as each row is burned
      [
        ["l1", 0.2],
        ["r1", 0.4],
        ["l2", 0.6],
        ["l3", 1.0],
        ["r2", 1.1],
        ["l4", 1.2],
        ["l5", 1.4],
        ["l6", 1.6]
      ].forEach(function (p) {
        tl.fromTo(
          el(p[0]),
          { opacity: 0.35 },
          { opacity: 1, duration: 0.16, ease: "power1.out" },
          p[1] + 0.02
        );
      });

      // the freed ticket swings once under the slot, then hangs still
      var ticket = el("ticket");
      var SWAY = [
        [1.92, 0.26, 0, 0.8],
        [2.18, 0.32, 0.8, -0.5],
        [2.5, 0.32, -0.5, 0.22],
        [2.82, 0.3, 0.22, 0]
      ];
      SWAY.forEach(function (s, i) {
        tl.fromTo(
          ticket,
          { rotation: s[2], transformOrigin: "180px 0px" },
          { rotation: s[3], duration: s[1], ease: "sine.inOut", immediateRender: i === 0 },
          s[0]
        );
      });

      // ---------- Scene 2 (1.6-3.0s): the headline rises word by word ----------
      var words = el("headline").querySelectorAll('[class~="02-la-promesse-word"]');
      var WORD_T = [1.6, 1.73, 1.86, 2.0, 2.15, 2.4, 2.6];
      for (var w = 0; w < words.length; w++) {
        tl.fromTo(
          words[w],
          { y: 42, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
          WORD_T[w]
        );
      }

      // ---------- Scene 3 (3.0-4.6s): the logo prints itself, the lockup lands ----------
      // gold stamp-ring hits at 3.0 (stamp entrance + 2px settle), then one pulse
      var ring = el("ring");
      var echo = el("echo");
      tl.fromTo(
        ring,
        { scale: 1.35, opacity: 0 },
        { scale: 1, opacity: 0.9, duration: 0.22, ease: "power3.out" },
        3.0
      );
      tl.fromTo(ring, { y: 0 }, { y: 2, duration: 0.06, ease: "power1.out" }, 3.22);
      tl.fromTo(
        ring,
        { y: 2 },
        { y: 0, duration: 0.06, ease: "power1.in", immediateRender: false },
        3.28
      );
      tl.fromTo(echo, { scale: 1 }, { scale: 1.45, duration: 0.6, ease: "power2.out" }, 3.18);
      tl.fromTo(echo, { opacity: 0 }, { opacity: 0.8, duration: 0.04, ease: "none" }, 3.18);
      tl.fromTo(
        echo,
        { opacity: 0.8 },
        { opacity: 0, duration: 0.56, ease: "power1.out", immediateRender: false },
        3.22
      );

      // svg-path-draw: measure each stroke, one dash = the whole path
      function prep(node, fallback) {
        var len = fallback;
        try {
          var m = node.getTotalLength();
          if (m > 0) len = m;
        } catch (e) {}
        len = len * 1.02 + 2;
        node.style.strokeDasharray = len + " " + len * 2;
        return len;
      }
      function draw(name, fallback, start, dur) {
        var node = el(name);
        var len = prep(node, fallback);
        tl.fromTo(
          node,
          { strokeDashoffset: len },
          { strokeDashoffset: 0, duration: dur, ease: "power2.out" },
          start
        );
      }
      function fill(name, start, dur) {
        tl.fromTo(
          el(name),
          { fillOpacity: 0 },
          { fillOpacity: 1, duration: dur, ease: "power1.out" },
          start
        );
      }
      // le contour d'un tracé s'efface quand son aplat arrive (la lettre garde sa graisse)
      function settle(name, start, dur) {
        fill(name, start, dur);
        tl.fromTo(el(name), { strokeOpacity: 1 }, { strokeOpacity: 0, duration: dur, ease: "power1.out" }, start);
      }
      draw("logo-outline", 1818, 3.0, 0.4); // green tile outline
      fill("logo-fill", 3.28, 0.24); // tile fills in
      draw("logo-letter", 1700, 3.3, 0.44); // the À, outline first
      settle("logo-letter", 3.66, 0.22);
      draw("logo-accent", 260, 3.72, 0.22); // grave accent
      settle("logo-accent", 3.9, 0.16);
      draw("logo-centre-outline", 150, 3.8, 0.24); // gold full stop
      settle("logo-centre-outline", 3.98, 0.12);
      fill("logo-centre", 3.98, 0.2);
      // the mark grows into place as it is printed
      tl.fromTo(
        el("logo"),
        { scale: 0.88 },
        { scale: 1, duration: 1.4, ease: "power2.out" },
        3.0
      );

      // headline clears upward (cut-the-curve: power4.in out / power4.out in, same path)
      var headline = el("headline");
      tl.fromTo(headline, { y: 0 }, { y: -230, duration: 0.3, ease: "power4.in" }, 3.2);
      tl.fromTo(headline, { opacity: 1 }, { opacity: 0, duration: 0.22, ease: "power1.in" }, 3.26);

      // wordmark lands at the cut, continuing the same upward motion
      var wordmark = el("wordmark");
      tl.fromTo(wordmark, { y: 230 }, { y: 0, duration: 0.3, ease: "power4.out" }, 3.5);
      tl.fromTo(wordmark, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, 3.5);

      tl.fromTo(
        el("tagline"),
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        3.68
      );

      // ---------- Scene 4 (4.6-6.0s): mono line types on, then the frame holds ----------
      var FULL = "QR CODE · NFC · SANS APPLI · SANS COMPTE";
      var T0 = 4.62;
      var CHAR = 0.017;
      var PAUSE = 0.06;
      var SEQUENCE = [{ t: 0, text: "" }];
      var t = T0;
      for (var c = 0; c < FULL.length; c++) {
        SEQUENCE.push({ t: t, text: FULL.slice(0, c + 1) });
        t += CHAR;
        if (FULL.charAt(c) === "·") t += PAUSE;
      }
      var T_DONE = SEQUENCE[SEQUENCE.length - 1].t;

      function textAt(time) {
        for (var i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
        }
        return "";
      }

      var typed = el("typed");
      var cursor = el("cursor");
      function cursorAt(time) {
        if (time < T0 - 0.04) return "0";
        if (time < T_DONE + 0.05) return "1";
        // blink on the 120 bpm beat (0.5 s period), deterministic square wave
        return Math.sin(((time - T_DONE - 0.05) / 0.5) * Math.PI * 2 + Math.PI / 2) > 0 ? "1" : "0";
      }
      typed.textContent = "";
      cursor.style.opacity = "0";

      var driver = { t: 0 };
      tl.fromTo(
        driver,
        { t: 0 },
        {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: function () {
            var txt = textAt(driver.t);
            if (typed.textContent !== txt) typed.textContent = txt;
            cursor.style.opacity = cursorAt(driver.t);
          }
        },
        0
      );

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
