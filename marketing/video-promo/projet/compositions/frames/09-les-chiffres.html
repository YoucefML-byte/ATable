  <script>
    (function () {
      var ID = "09-les-chiffres";
      function el(name) {
        return document.getElementById(ID + "-" + name);
      }
      function els(name) {
        return Array.prototype.slice.call(document.getElementsByClassName(ID + "-" + name));
      }

      var tl = gsap.timeline({ paused: true });

      var win = el("window");
      var outer = el("zoom-outer");
      var inner = el("zoom-inner");
      var words = els("word");
      var rule = el("rule");
      var figA = el("fig-a");
      var rowA = el("row-a");
      var numA = el("num-a");
      var labelA = el("label-a");
      var figB = el("fig-b");
      var rowB = el("row-b");
      var numB = el("num-b");
      var ring = el("ring");
      var leader = el("leader");
      var callout = el("callout");
      var foot = el("foot");

      // French money format, always: narrow no-break space thousands, comma decimal, 2 decimals.
      var NNBSP = " ";
      function euros(cents) {
        var c = Math.round(cents);
        var e = Math.floor(c / 100);
        var r = c - e * 100;
        return String(e).replace(/\B(?=(\d{3})+(?!\d))/g, NNBSP) + "," + (r < 10 ? "0" : "") + r;
      }

      // ---- camera: coordinate-target-zoom, nested wrappers (outer scales around the
      // screen centre, inner counter-translates T = -offset). Screen 1116x698, centre (558,349).
      // Targets in screenshot pixels (1800x3099); T does not depend on the scale.
      var CX = 558;
      var CY = 349;
      function view(s, cx, cy) {
        return { s: s, x: CX - cx, y: CY - cy };
      }
      var V = {
        wide: view(0.62, 900, 562.9), // full width, top of the dashboard
        wideIn: view(0.645, 900, 562.9), // slow drift-in
        kpiA: view(1.75, 496.5, 419.5), // KPI « Montant commandé validé » [321,336,672,503]
        kpiAIn: view(1.78, 496.5, 419.5),
        kpiB: view(1.78, 1234, 419.5), // KPI « Panier moyen » [1058,336,1410,503]
        kpiBIn: view(1.81, 1234, 419.5),
        rush: view(0.68, 1049.5, 1368) // rush heatmap [321,1190,1778,1546]
      };
      function move(a, b, at, dur, ease, first) {
        tl.fromTo(
          outer,
          { scale: a.s },
          { scale: b.s, duration: dur, ease: ease, force3D: false, immediateRender: !!first },
          at
        );
        tl.fromTo(
          inner,
          { x: a.x, y: a.y },
          { x: b.x, y: b.y, duration: dur, ease: ease, force3D: false, immediateRender: !!first },
          at
        );
      }
      function blurPulse(at, half, peak) {
        tl.fromTo(
          outer,
          { filter: "blur(0px)" },
          { filter: "blur(" + peak + "px)", duration: half, ease: "power2.in", immediateRender: false },
          at
        );
        tl.fromTo(
          outer,
          { filter: "blur(" + peak + "px)" },
          { filter: "blur(0px)", duration: half, ease: "power2.out", immediateRender: false },
          at + half
        );
      }

      // ---- Scene 1 (0.0–1.0): window enters tilted and flattens; headline at 0.3
      tl.fromTo(
        win,
        { x: 60, rotationY: -12, rotationX: 5, scale: 0.95 },
        { x: 0, rotationY: 0, rotationX: 0, scale: 1, duration: 0.9, ease: "power3.out" },
        0
      );
      tl.fromTo(win, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 0);
      move(V.wide, V.wideIn, 0, 1.0, "sine.inOut", true);
      tl.fromTo(
        words,
        { y: 36, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out", stagger: 0.07 },
        0.3
      );

      // ---- Scene 2 (1.0–2.5): push THROUGH onto « Montant commandé validé »; count-up 0 → 27 019,10 €
      move(V.wideIn, V.kpiA, 1.0, 0.9, "power3.inOut");
      blurPulse(1.0, 0.45, 3);
      move(V.kpiA, V.kpiAIn, 1.9, 0.6, "sine.inOut");
      tl.fromTo(rule, { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.95);

      var countA = { v: 0 };
      tl.fromTo(figA, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, 1.0);
      tl.fromTo(rowA, { scale: 0.55 }, { scale: 1, duration: 0.85, ease: "power3.out" }, 1.0);
      tl.fromTo(
        countA,
        { v: 0 },
        {
          v: 2701910,
          duration: 0.85,
          ease: "power3.out",
          immediateRender: false,
          onUpdate: function () {
            numA.textContent = euros(countA.v);
          }
        },
        1.0
      );
      tl.fromTo(labelA, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.15);

      // ---- Scene 3 (2.5–4.0): pan to « Panier moyen »; overlay swaps leftward with the pan
      // (cut-the-curve, mirrored power4 halves, cut at the pan's peak velocity 2.8 s)
      move(V.kpiAIn, V.kpiB, 2.5, 0.6, "power3.inOut");
      blurPulse(2.5, 0.3, 3);
      move(V.kpiB, V.kpiBIn, 3.1, 0.9, "sine.inOut");

      tl.fromTo(figA, { x: 0 }, { x: -230, duration: 0.3, ease: "power4.in", immediateRender: false }, 2.5);
      tl.fromTo(figA, { opacity: 1 }, { opacity: 0, duration: 0.28, ease: "power1.in", immediateRender: false }, 2.5);

      var countB = { v: 0 };
      tl.fromTo(figB, { x: 230 }, { x: 0, duration: 0.34, ease: "power4.out" }, 2.8);
      tl.fromTo(figB, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 2.8);
      tl.fromTo(rowB, { scale: 0.55 }, { scale: 1, duration: 0.6, ease: "power3.out" }, 2.8);
      tl.fromTo(
        countB,
        { v: 0 },
        {
          v: 3005,
          duration: 0.6,
          ease: "power3.out",
          immediateRender: false,
          onUpdate: function () {
            numB.textContent = euros(countB.v);
          }
        },
        2.8
      );

      // ---- Scene 4 (4.0–6.0): pull back + pan down to the rush heatmap; gold ring, callout, footline; hold
      move(V.kpiBIn, V.rush, 4.0, 0.9, "power3.inOut");
      blurPulse(4.0, 0.45, 2.5);
      tl.fromTo(ring, { scale: 1.08, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, 4.85);
      tl.fromTo(leader, { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power3.out" }, 5.0);
      tl.fromTo(callout, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 5.1);
      tl.fromTo(foot, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 5.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
