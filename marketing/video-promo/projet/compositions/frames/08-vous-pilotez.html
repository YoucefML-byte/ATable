  <script>
    (function () {
      var ID = "08-vous-pilotez";
      var byId = function (s) {
        return document.getElementById(ID + "-" + s);
      };
      var root = byId("grid").parentNode;
      var all = function (cls) {
        return Array.prototype.slice.call(root.querySelectorAll('[class~="' + ID + "-" + cls + '"]'));
      };

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0-1.5s): rail tag slides 04 -> 05 PATRON, headline per-word reveal.
      tl.fromTo(byId("tag"), { x: 0 }, { x: 192, duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo(byId("dot5"), { backgroundColor: "#F4EFE6" }, { backgroundColor: "#E0A33A", duration: 0.15, ease: "power1.out" }, 0.45);
      tl.fromTo(byId("station5"), { opacity: 0.45 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 0.45);

      tl.fromTo(all("slot"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out", stagger: 0.08 }, 0.2);

      tl.fromTo(
        all("word"),
        { y: 44, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.7, ease: "power3.out", stagger: 0.09 },
        0.3
      );

      // Scene 2 (1.5-6.5s): one tile per 1.2s slides up into its slot; its crop does a
      // short coordinate-target zoom (outer scales 1 -> 1.08 about centre, inner
      // counter-translates by -offset, same start / duration / ease), then stops.
      // Offsets are (target - crop centre) x crop scale, baked from image pixels.
      var ZOOM = 1.08;
      var tiles = [
        { at: 1.5, tx: 5.68, ty: -18.83 },  // patron-carte: aim at the price + tags form
        { at: 2.7, tx: 14.68, ty: 0 },      // patron-horaires: keep day labels in view
        { at: 3.9, tx: 0, ty: 6.2 },        // patron-qr: keep the finder patterns in view
        { at: 5.1, tx: 17.46, ty: 2.77 }    // patron-theme: presets side
      ];
      tiles.forEach(function (t, i) {
        var n = i + 1;
        var tile = byId("tile" + n);
        tl.fromTo(tile, { y: 56 }, { y: 0, duration: 0.85, ease: "power4.out" }, t.at);
        tl.fromTo(tile, { opacity: 0 }, { opacity: 1, duration: 0.28, ease: "power1.out" }, t.at);
        tl.fromTo(byId("zo" + n), { scale: 1 }, { scale: ZOOM, duration: 1.1, ease: "power2.inOut" }, t.at + 0.25);
        tl.fromTo(byId("zi" + n), { x: 0, y: 0 }, { x: t.tx, y: t.ty, duration: 1.1, ease: "power2.inOut" }, t.at + 0.25);
      });

      // Scene 3 (6.5-8.0s): tiles held still; gold rule underlines the headline.
      tl.fromTo(byId("rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, 6.5);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
