  <script>
    (function () {
      var ID = "03-un-scan";
      function $(s) { return document.getElementById(ID + "-" + s); }
      function $$(root, c) { return Array.prototype.slice.call(root.querySelectorAll('[class~="' + ID + "-" + c + '"]')); }

      var GOLD = "#E0A33A", CREAM = "#F4EFE6", OK_GREEN = "#047857";
      var tl = gsap.timeline({ paused: true });

      /* ---- Scene 1 (0.0–1.4): rail tag, tent, phone rise, scan ---- */
      // ticket tag slides from above the previous station (x 560) to 01 CLIENT (x 660)
      tl.fromTo($("tag"), { x: -100 }, { x: 0, duration: 0.6, ease: "power3.out", force3D: false }, 0);
      tl.fromTo($("tag"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0);
      tl.fromTo($("dot1"), { backgroundColor: CREAM }, { backgroundColor: GOLD, duration: 0.15, ease: "power1.out" }, 0.45);

      // the plate is on screen from frame 0, settling gently
      tl.fromTo($("tent"), { y: 18 }, { y: 0, duration: 0.8, ease: "power2.out", force3D: false }, 0);

      // phone rises from below and settles at centre (1250, 520)
      tl.fromTo($("phone"), { y: 960, rotation: 3 }, { y: 0, rotation: 0, duration: 0.75, ease: "power3.out", force3D: false }, 0.3);
      // the camera view counter-drifts as the phone lifts, then focuses
      tl.fromTo($("camworld"), { y: -220 }, { y: 0, duration: 0.75, ease: "power3.out", force3D: false }, 0.3);
      tl.fromTo($("camworld"), { filter: "blur(6px)" }, { filter: "blur(0px)", duration: 0.5, ease: "power2.out" }, 0.55);
      tl.fromTo($("brackets"), { scale: 1.1 }, { scale: 1, duration: 0.6, ease: "power2.out", force3D: false }, 0.65);

      // headline lands at display size (masked rise)
      tl.fromTo($$($("head"), "hw"), { yPercent: 110 }, { yPercent: 0, duration: 0.8, ease: "power3.out", stagger: 0.12, force3D: false }, 0.5);

      // gold scan line sweeps once (0.8–1.3)
      tl.fromTo($("scan"), { y: 166 }, { y: 466, duration: 0.5, ease: "sine.inOut", force3D: false }, 0.8);
      tl.fromTo($("scan"), { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, 0.8);
      tl.to($("scan"), { opacity: 0, duration: 0.06, ease: "none" }, 1.24);

      /* ---- Scene 2 (1.4–3.0): brackets snap green, inverse zoom-through into the menu ---- */
      tl.to($$($("brackets"), "corner"), { borderColor: OK_GREEN, duration: 0.06, ease: "none" }, 1.4);
      tl.to($("brackets"), { scale: 0.95, duration: 0.14, ease: "power3.out", force3D: false }, 1.4);

      // exit: camera view recedes upward (full-surface blur 18px)
      tl.to($("cam"), { scale: 0.8, y: -40, filter: "blur(18px)", duration: 0.2, ease: "power3.in", force3D: false }, 1.5);
      tl.to($("cam"), { opacity: 0.15, duration: 0.2, ease: "none" }, 1.5);
      // hard cut at peak blur
      tl.set($("menu"), { opacity: 0, immediateRender: true }, 0);
      tl.set($("cam"), { opacity: 0 }, 1.7);
      tl.set($("menu"), { opacity: 0.15, scale: 1.25, y: 56, filter: "blur(18px)", force3D: false }, 1.7);
