  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var ID = "10-en-confiance";
      var P = ID + "-";
      var byId = function (s) {
        return document.getElementById(P + s);
      };
      var scope = document.querySelector('[data-composition-id="' + ID + '"]') || document;
      var all = function (cls) {
        return Array.prototype.slice.call(scope.querySelectorAll('[class~="' + P + cls + '"]'));
      };

      var INK = "#0C1613";
      var GOLD = "#E0A33A";
      var CREAM = "#F4EFE6";
      var DURATION = 6;

      var tl = gsap.timeline({ paused: true });

      // ---------- Scene 1 (0.0–1.0): rail tag 05 → 06, desk card, anchor per-word ----------
      tl.fromTo(byId("tag"), { x: 0 }, { x: 192, duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo(
        byId("dot5"),
        { backgroundColor: GOLD },
        { backgroundColor: INK, duration: 0.15, ease: "none" },
        0.45,
      );
      tl.fromTo(
        byId("dot6"),
        { backgroundColor: CREAM },
        { backgroundColor: GOLD, duration: 0.15, ease: "none" },
        0.45,
      );
      tl.fromTo(byId("label6"), { opacity: 0.45 }, { opacity: 1, duration: 0.2, ease: "none" }, 0.45);

      tl.fromTo(byId("desk"), { opacity: 0 }, { opacity: 0.6, duration: 0.6, ease: "power2.out" }, 0.3);

      // Anchor « Un outil. Tous vos commerces. » — word-by-word build from 0.2 s, then pinned.
      tl.fromTo(
        all("word"),
        { opacity: 0, y: 56, filter: "blur(8px)" },
        {
          opacity: 1,
          y: 0,
          filter: "blur(0px)",
          duration: 0.55,
          ease: "power3.out",
          stagger: 0.08,
        },
        0.2,
      );

      // ---------- Scene 2 (1.0–1.6): theme-crossfade-morph, Bistrot → Lounge ----------
      var MORPH_AT = 1.0;
      var MORPH_DUR = 0.4;
      tl.fromTo(
        byId("skin-b"),
        { opacity: 0 },
        { opacity: 1, duration: MORPH_DUR, ease: "power2.inOut" },
        MORPH_AT,
      );
      tl.fromTo(
        byId("skin-a"),
        { opacity: 1 },
        { opacity: 0, duration: MORPH_DUR, ease: "power2.inOut", immediateRender: false },
        MORPH_AT,
      );
      tl.fromTo(
        byId("plabel-b"),
        { opacity: 0 },
        { opacity: 1, duration: MORPH_DUR, ease: "power2.inOut" },
        MORPH_AT,
      );
      tl.fromTo(
        byId("plabel-a"),
        { opacity: 1 },
        { opacity: 0, duration: MORPH_DUR, ease: "power2.inOut", immediateRender: false },
        MORPH_AT,
      );

      // ---------- Scene 3 (2.0–5.5): discrete-text-sequence, hard-cut swaps ----------
      var SEQUENCE = [
        { t: 0.0, text: "" },
        { t: 2.0, text: "Chaque commerce,\nses données." },
        { t: 3.0, text: "Les prix calculés\npar le serveur." },
        { t: 4.0, text: "Double authentification\npour les patrons." },
        { t: 5.0, text: "Paiement au comptoir." },
        { t: 5.5, text: "" },
      ];
      var RESOLVE_AT = 5.5;
      var POP_DUR = 0.22;

      function stateAt(time) {
        for (var i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i];
        }
        return SEQUENCE[0];
      }

      var trustEl = byId("trust");
      var checkEl = byId("check");
      var rowGate = byId("rowgate");
      var resGate = byId("resgate");

      // Pure function of time — identical frame under any seek order.
      function render(time) {
        var st = stateAt(time);
        if (trustEl.textContent !== st.text) trustEl.textContent = st.text;
        var on = st.text !== "";
        rowGate.style.opacity = on ? "1" : "0";
        // Gold check stamps on every swap (scale 1.3 → 1, power3.out over POP_DUR).
        var p = on ? Math.min(1, Math.max(0, (time - st.t) / POP_DUR)) : 1;
        var s = 1.3 - 0.3 * (1 - Math.pow(1 - p, 3));
        checkEl.style.transform = "scale(" + s.toFixed(4) + ")";
        resGate.style.opacity = time >= RESOLVE_AT ? "1" : "0";
      }

      var driver = { t: 0 };
      tl.to(
        driver,
        {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: function () {
            render(driver.t);
          },
        },
        0,
      );
      render(0);

      // ---------- Scene 4 (5.0–6.0): inverse zoom-through into the resolve ----------
      // Exit: « Paiement au comptoir. » recedes (wrapper-level blur, text scale).
      tl.fromTo(
        byId("row"),
        { scale: 1, filter: "blur(0px)" },
        { scale: 0.8, filter: "blur(10px)", duration: 0.2, ease: "power3.in", immediateRender: false },
        RESOLVE_AT - 0.2,
      );
      tl.fromTo(
        byId("row"),
        { opacity: 1 },
        { opacity: 0.15, duration: 0.2, ease: "none", immediateRender: false },
        RESOLVE_AT - 0.2,
      );
      // Hard cut at 5.5 (gates flip in render) — the resolve arrives oversized and retracts.
      tl.fromTo(
        byId("resolve"),
        { opacity: 0.15, scale: 1.25, filter: "blur(10px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out" },
        RESOLVE_AT,
      );
      // Gold rule draws from the left, landing before the frame ends; then hold.
      tl.fromTo(
        byId("goldrule"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.35, ease: "power3.out" },
        RESOLVE_AT + 0.05,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
