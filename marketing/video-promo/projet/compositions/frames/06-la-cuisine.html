      (function () {
        var FRAME = "06-la-cuisine";
        var el = function (id) {

        var CREAM = "#F4EFE6";
        var GREEN = "#1F4D3A";
        var GOLD = "#E0A33A";

        // Card 1 [384,252,740,674] in screenshot pixels; world is fitted at 0.5333 into the 1024×640 screen.
        var FIT = 1024 / 1920;
        var OFFSET_X = (562 - 960) * FIT; // card centre minus screen centre, screen px
        var OFFSET_Y = (463 - 600) * FIT;
        var ZOOM_SCALE = 2.0; // card ≈ 70% of screen height at peak (headroom cap ≈ 2.5)

        var tl = gsap.timeline({ paused: true });

        // ---------- Scene 1 (0.0–1.5): rail tag 02 → 03, timers live, headline ----------
        tl.fromTo(el("tag"), { x: -192 }, { x: 0, duration: 0.6, ease: "power3.out" }, 0);
        tl.fromTo(
          el("dot2"),
          { backgroundColor: GOLD },
          { backgroundColor: CREAM, duration: 0.15, ease: "power1.out" },
          0.45,
        );
        tl.fromTo(
          el("dot3"),
          { backgroundColor: GREEN },
          { backgroundColor: GOLD, duration: 0.15, ease: "power1.out" },
          0.45,
        );
        tl.fromTo(
          el("label3"),
          { opacity: 0.45 },
          { opacity: 1, duration: 0.15, ease: "power1.out" },
          0.45,
        );

        // live timers, driven only by timeline time: +1 s per second from 00:10 and 00:09;
        // card 1 stops at the PRÊTE press (3.5 s).
        var t1 = el("t1");
        var t2 = el("t2");
        var fmt = function (s) {
          return "00:" + (s < 10 ? "0" : "") + s;
        };
        var clock = { t: 0 };
        var renderClock = function () {
          var whole = Math.floor(clock.t + 1e-4);
          var a = fmt(10 + Math.min(whole, 3));
          var b = fmt(9 + whole);
          if (t1.textContent !== a) t1.textContent = a;
          if (t2.textContent !== b) t2.textContent = b;
        };
        tl.fromTo(
          clock,
          { t: 0 },
          { t: 6, duration: 6, ease: "none", onUpdate: renderClock },
          0,
        );

        var wordsA = el("copy-a").querySelectorAll("span");
        tl.fromTo(
          wordsA,
          { y: 36, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.6, ease: "power3.out", stagger: 0.07 },
          0.5,
        );

        // ---------- Scene 2 (1.5–3.5): coordinate-target-zoom onto card 1 ----------
        // nested wrappers: outer scales about the screen centre, inner counter-translates by -offset
        tl.fromTo(
          el("cam-outer"),
          { scale: 1 },
          { scale: ZOOM_SCALE, duration: 1.0, ease: "power3.inOut", force3D: false },
          1.5,
        );
        tl.fromTo(
          el("cam-inner"),
          { x: 0, y: 0 },
          { x: -OFFSET_X, y: -OFFSET_Y, duration: 1.0, ease: "power3.inOut", force3D: false },
          1.5,
        );

        // gold ring on the timer
        tl.fromTo(
          el("ring"),
          { scale: 1.08, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
          2.0,
        );

        // mono callout
        tl.fromTo(
          el("callout-rule"),
          { scaleX: 0 },
          { scaleX: 1, duration: 0.3, ease: "power3.out" },
          2.0,

        tl.fromTo(
          el("callout"),
          { clipPath: "inset(0% 100% 0% 0%)", x: -10 },
          { clipPath: "inset(0% 0% 0% 0%)", x: 0, duration: 0.55, ease: "power2.out" },
          2.08,
        );

        // ---------- Scene 3 (3.5–6.0): PRÊTE pressed, stamp, toast, payoff, zoom back ----------
        // press-release-spring: linear-ish dip, spring release (adjacent → state continuity)
        var btn = el("btn");
        tl.fromTo(
          btn,
          { scale: 1, filter: "brightness(1)" },
          { scale: 0.92, filter: "brightness(0.86)", duration: 0.1, ease: "power1.in" },
          3.4,
        );
        tl.to(
          btn,
          { scale: 1, filter: "brightness(1)", duration: 0.5, ease: "back.out(2)" },
          3.5,
        );
        // flat release ring behind the button
        var burst = el("burst");
        tl.fromTo(burst, { scale: 1 }, { scale: 1.16, duration: 0.5, ease: "power2.out" }, 3.5);
        tl.fromTo(burst, { opacity: 0 }, { opacity: 0.9, duration: 0.06, ease: "none" }, 3.5);
        tl.to(burst, { opacity: 0, duration: 0.44, ease: "power1.in" }, 3.56);

        // green stamp lands on the card
        var stamp = el("stamp");
        tl.fromTo(
          stamp,
          { scale: 1.35, opacity: 0, y: 0 },
          { scale: 1, opacity: 0.9, y: 0, duration: 0.22, ease: "power3.out" },
          3.8,
        );
        tl.to(stamp, { y: 1.8, duration: 0.06, ease: "power1.out" }, 4.02);
        tl.to(stamp, { y: 0, duration: 0.06, ease: "power1.in" }, 4.08);

        // toast slides in at the tablet's top-right
        tl.fromTo(
          el("toast"),
          { x: 64, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
          3.8,
        );

        // headline swap — inverse zoom-through (recede, hard cut at 4.0, arrive oversized)
        var copyA = el("copy-a");
        var copyB = el("copy-b");
        tl.to(copyA, { scale: 0.8, filter: "blur(10px)", duration: 0.2, ease: "power3.in" }, 3.8);
        tl.to(wordsA, { opacity: 0.15, duration: 0.2, ease: "none" }, 3.8);
        tl.fromTo(
          el("copy-a-wrap"),
          { opacity: 1 },
          { opacity: 0, duration: 0.01, ease: "none" },
          3.99,
        );
        tl.fromTo(
          el("copy-b-wrap"),
          { opacity: 0 },
          { opacity: 1, duration: 0.01, ease: "none" },

        );
        tl.fromTo(

          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" },

        window.__timelines[FRAME] = tl;
