  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var FID = "05-en-salle";
      var root = document.querySelector('[data-composition-id="' + FID + '"]');
      function el(n) {
        return document.getElementById(FID + "-" + n);
      }
      function all(c) {
        return Array.prototype.slice.call(root.querySelectorAll('[class~="' + FID + "-" + c + '"]'));
      }

      var tl = gsap.timeline({ paused: true });

      // ---------- flying card writer (lift → arc flight) ----------
      var card = el("card");
      var lift = { p: 0 };
      var fly = { p: 0 };
      var CW = 436,
        CH = 72;
      var P0 = { x: 330, y: 383 }; // « N° 001 » on the phone screen
      var P1 = { x: 330, y: 318 }; // lifted off the screen
      var PC = { x: 660, y: 150 }; // arc control point
      var P2 = { x: 1013.73, y: 482.13 }; // centre of À valider card region [384,277,875,781]
      var S_LAND = 261.87 / CW;
      function writeCard() {
        var x, y, s, r, t, u;
        if (fly.p > 0) {
          t = fly.p;
          u = 1 - t;
          x = u * u * P1.x + 2 * u * t * PC.x + t * t * P2.x;
          y = u * u * P1.y + 2 * u * t * PC.y + t * t * P2.y;
          s = 0.85 + (S_LAND - 0.85) * t;
          r = -4 + 4 * t;
        } else {
          t = lift.p;
          x = P0.x;
          y = P0.y + (P1.y - P0.y) * t;
          s = 0.42 + (0.85 - 0.42) * t;
          r = -4 * t;
        }
        card.style.transform =
          "translate(" + (x - CW / 2).toFixed(2) + "px, " + (y - CH / 2).toFixed(2) + "px) rotate(" +
          r.toFixed(3) + "deg) scale(" + s.toFixed(4) + ")";
      }

      // ---------- motion-blur streak on the card (Path A, X axis) ----------
      var streakNode = el("streak-blur");
      var streak = { v: 0 };
      function writeStreak() {
        streakNode.setAttribute("stdDeviation", streak.v.toFixed(2) + " 0");
        card.style.filter = streak.v > 0.05 ? "url(#05-en-salle-streak)" : "none";
      }

      // ---------- in-screen camera (outer scales, inner translates; T = -offset) ----------
      var zOuter = el("zouter");
      var zInner = el("zinner");
      var ringPos = el("ringpos");
      var burstPos = el("burstpos");
      var stampPos = el("stamppos");
      var cam = { s: 1, tx: 0, ty: 0 };
      var CX = 512,
        CY = 320;
      function mapX(px) {
        return CX + cam.s * (px + cam.tx - CX);
      }
      function mapY(py) {
        return CY + cam.s * (py + cam.ty - CY);
      }
      function setBox(n, x0, y0, x1, y1, pad) {
        n.style.left = (x0 - pad).toFixed(2) + "px";
        n.style.top = (y0 - pad).toFixed(2) + "px";
        n.style.width = (x1 - x0 + 2 * pad).toFixed(2) + "px";
        n.style.height = (y1 - y0 + 2 * pad).toFixed(2) + "px";
      }
      function applyCamera() {
        zOuter.style.transform = "scale(" + cam.s.toFixed(4) + ")";
        zInner.style.transform = "translate(" + cam.tx.toFixed(2) + "px, " + cam.ty.toFixed(2) + "px)";
        // ring around the card region (image px [384,277,875,781] × 0.5333): 6px gap + 4px stroke
        setBox(ringPos, mapX(204.8), mapY(147.733), mapX(466.667), mapY(416.533), 10);
        // burst around the « Valider » button (image px [411,671,667,754])
        setBox(burstPos, mapX(219.2), mapY(357.867), mapX(355.733), mapY(402.133), 6);
        // stamp anchor on the card
        stampPos.style.left = mapX(335.733).toFixed(2) + "px";
        stampPos.style.top = mapY(300).toFixed(2) + "px";
      }

      var zwrap = el("zwrap");
      var zNode = el("zblur-node");
      var zb = { v: 0 };
      function writeZBlur() {
        zNode.setAttribute("stdDeviation", zb.v.toFixed(2) + " " + zb.v.toFixed(2));
        zwrap.style.filter = zb.v > 0.05 ? "url(#05-en-salle-zblur)" : "none";
      }

      // seed frame 0
      writeCard();
      writeStreak();
      applyCamera();
      writeZBlur();

      // ================= Scene 1 (0.0–1.0): rail, lift-off, flight, devices swap =================
      tl.fromTo(el("tag"), { x: -192 }, { x: 0, duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo(
        el("dot2"),
        { backgroundColor: "#F4EFE6" },
        { backgroundColor: "#E0A33A", duration: 0.12, ease: "none" },
        0.45,
      );
      tl.fromTo(el("lab2"), { opacity: 0.45 }, { opacity: 1, duration: 0.15, ease: "none" }, 0.45);

      tl.fromTo(el("tablet"), { x: 1300 }, { x: 0, duration: 0.9, ease: "power3.out" }, 0);
      tl.fromTo(
        el("phone"),
        { x: 0, scale: 0.55 },
        { x: -600, scale: 0.55, duration: 0.55, ease: "power3.in" },
        0.45,
      );

      tl.fromTo(card, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, 0.12);
      tl.fromTo(
        lift,
        { p: 0 },
        { p: 1, duration: 0.28, ease: "power2.out", onUpdate: writeCard, immediateRender: false },
        0.12,
      );
      tl.fromTo(
        fly,
        { p: 0 },
        { p: 1, duration: 0.58, ease: "power3.inOut", onUpdate: writeCard, immediateRender: false },
        0.4,
      );
      // inOut leg: envelope split at the velocity peak (seeded at 0)
      tl.fromTo(
        streak,
        { v: 0 },
        { v: 16, duration: 0.29, ease: "power3.in", onUpdate: writeStreak, immediateRender: false },
        0.4,
      );
      tl.fromTo(
        streak,
        { v: 16 },
        { v: 0, duration: 0.29, ease: "power3.out", onUpdate: writeStreak, immediateRender: false },
        0.69,
      );

      // ================= Scene 2 (1.0–2.6): landing, dissolve, ring, callout, headline =================
      tl.fromTo(card, { opacity: 1 }, { opacity: 0, duration: 0.14, ease: "power1.out", immediateRender: false }, 1.0);
      tl.fromTo(
        el("foot"),
        { opacity: 0, scaleY: 0.161 },
        { opacity: 1, scaleY: 1, duration: 0.3, ease: "power3.out" },
        1.0,
      );
      tl.fromTo(
        el("foot"),
        { opacity: 1 },
        { opacity: 0, duration: 0.34, ease: "power2.out", immediateRender: false },
        1.3,
      );
      tl.fromTo(
        el("ring"),
        { scale: 1.08, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        1.12,
      );
      tl.fromTo(
        el("callout"),
        { y: 14, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        1.05,
      );
      all("hw").forEach(function (w, i) {
        tl.fromTo(w, { yPercent: 110 }, { yPercent: 0, duration: 0.6, ease: "power3.out" }, 1.0 + i * 0.08);
      });
      // hold stays alive: slow push toward the button
      tl.fromTo(
        cam,
        { s: 1, tx: 0, ty: 0 },
        { s: 1.025, tx: 4.0, ty: -1.07, duration: 0.9, ease: "none", onUpdate: applyCamera, immediateRender: false },
        1.65,
      );

      // ================= Scene 3 (2.6–4.2): dive onto « Valider », press, stamp =================
      tl.fromTo(
        cam,
        { s: 1.025, tx: 4.0, ty: -1.07 },
        { s: 2.4, tx: 224, ty: -60, duration: 0.65, ease: "power4.out", onUpdate: applyCamera, immediateRender: false },
        2.55,
      );
      tl.fromTo(
        zb,
        { v: 0 },
        { v: 4, duration: 0.06, ease: "power1.in", onUpdate: writeZBlur, immediateRender: false },
        2.55,
      );
      tl.fromTo(
        zb,
        { v: 4 },
        { v: 0, duration: 0.5, ease: "power4.out", onUpdate: writeZBlur, immediateRender: false },
        2.61,
      );

      var btn = el("btn");
      tl.fromTo(btn, { scale: 1 }, { scale: 0.9, duration: 0.12, ease: "power1.in", immediateRender: false }, 3.0);
      tl.fromTo(btn, { scale: 0.9 }, { scale: 1, duration: 0.6, ease: "back.out(2.2)", immediateRender: false }, 3.12);
      tl.fromTo(
        el("burst"),
        { scale: 1, opacity: 0 },
        { scale: 1.35, opacity: 0.9, duration: 0.3, ease: "power2.out" },
        3.12,
      );
      tl.fromTo(
        el("burst"),
        { opacity: 0.9 },
        { opacity: 0, duration: 0.4, ease: "power2.in", immediateRender: false },
        3.42,
      );

      var stamp = el("stamp");
      tl.fromTo(
        stamp,
        { xPercent: -50, yPercent: -50, rotation: -8, scale: 1.35, opacity: 0, y: 0 },
