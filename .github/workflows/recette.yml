# Staging ("recette") database: installs the schema and the demo data on the Supabase test
# project, then pushes the Auth settings. Started by hand only (Actions → "Recette — installer la
# base" → Run workflow). Everything in this project is ERASED at each run: never point it at
# production. Step-by-step guide: docs/RECETTE.md.
name: Recette — installer la base

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Tapez RECETTE pour confirmer (la base de test sera entièrement remise à zéro)'
        required: true

permissions:
  contents: read

concurrency:
  group: recette
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.RECETTE_DB_PASSWORD }}
      RECETTE_PROJECT_REF: ${{ secrets.RECETTE_PROJECT_REF }}
      RECETTE_DEMO_PASSWORD: ${{ secrets.RECETTE_DEMO_PASSWORD }}
      RECETTE_PREFIX: ${{ vars.RECETTE_PREFIX }}
    steps:
      - name: Confirmation
        if: ${{ inputs.confirmation != 'RECETTE' }}
        run: |
          echo "::error::Confirmation manquante : tapez RECETTE dans le champ prévu."
          exit 1

      - name: Paramètres présents
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD RECETTE_PROJECT_REF RECETTE_DEMO_PASSWORD RECETTE_PREFIX; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Paramètres manquants dans GitHub (Settings → Secrets and variables → Actions) :$missing"
            exit 1
          fi
          if ! echo "$RECETTE_PROJECT_REF" | grep -Eq '^[a-z]{20}$'; then
            echo "::error::RECETTE_PROJECT_REF doit être l'identifiant du projet Supabase (20 lettres minuscules)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Données propres à la recette
        run: node scripts/recette-seed.mjs

      - name: Lier le projet Supabase
        run: pnpm exec supabase link --project-ref "$RECETTE_PROJECT_REF" --yes

      - name: Installer le schéma et les données de démonstration
        run: >
          pnpm exec supabase db reset --linked --yes
          --sql-paths ./recette/00-vider-comptes.sql
          --sql-paths ./seed.sql
          --sql-paths ./recette/.generated/10-recette.sql

      - name: Réglages d'authentification (adresses, inscriptions fermées, e-mails, 2FA)
        run: |
          work="$RUNNER_TEMP/recette"
          mkdir -p "$work"
          cp -r supabase "$work/supabase"
          pro="https://${RECETTE_PREFIX}-pro.vercel.app"
          console="https://${RECETTE_PREFIX}-console.vercel.app"
          sed -i \
            -e "s|^site_url = .*|site_url = \"$pro\"|" \
            -e "s|^additional_redirect_urls = .*|additional_redirect_urls = [\"$pro/**\", \"$console/**\"]|" \
            "$work/supabase/config.toml"
          grep -n '^site_url\|^additional_redirect_urls' "$work/supabase/config.toml"
          pnpm exec supabase config push --workdir "$work" --project-ref "$RECETTE_PROJECT_REF" --yes

      - name: Résumé
        run: |
          {
            echo "## Recette installée"
            echo ""
            echo "| Espace | Adresse |"
            echo "| --- | --- |"
            echo "| Site du Bistrot | https://${RECETTE_PREFIX}-bistrot.vercel.app |"
            echo "| Site du Lounge | https://${RECETTE_PREFIX}-lounge.vercel.app |"
            echo "| Espace pro | https://${RECETTE_PREFIX}-pro.vercel.app |"
            echo "| Console | https://${RECETTE_PREFIX}-console.vercel.app |"
            echo ""
            echo "Comptes : admin@atable.test, karim@bistrot.test, samia@lounge.test, avec le mot de passe RECETTE_DEMO_PASSWORD."
            echo "La double authentification se configure à la première connexion."
          } >> "$GITHUB_STEP_SUMMARY"
